name: Facebook and Instagram horror posts
on:
  schedule:
    - cron: '17 14 * * *' # Daily at 20:02 Asia/Kathmandu (14:17 UTC)
  workflow_dispatch: # Optional one-click run; no form fields
permissions:
  contents: write # Dedicated media branch: images and daily publication receipts
concurrency:
  group: horror-social
  cancel-in-progress: false
jobs:
  social:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v24.0' }}
      META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
      FACEBOOK_ID: ${{ secrets.FACEBOOK_ID }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID || vars.INSTAGRAM_ACCOUNT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "google-genai>=1.0,<3" requests python-dotenv loguru Pillow
      - name: Generate, host image and publish daily story
        run: python -m scripts.social_automation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: social-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/current/
          if-no-files-found: ignore
          retention-days: 7
