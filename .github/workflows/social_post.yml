name: Facebook and Instagram horror posts
on:
  workflow_dispatch:
    inputs:
      topic:
        description: Story topic
        type: string
      variant:
        description: Facebook text or photo; Instagram always uses an image
        type: choice
        options: [text, photo]
      prepared_run_id:
        description: To publish, enter a reviewed generation run ID; blank generates only
        type: string
      platforms:
        description: Publication destinations
        type: choice
        options: [facebook, instagram, both]
        default: facebook
      instagram_image_url:
        description: Public HTTPS URL of the reviewed post.jpg (required for Instagram)
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: horror-social
  cancel-in-progress: false
jobs:
  social:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
      META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
      FACEBOOK_ID: ${{ secrets.FACEBOOK_ID }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID || vars.INSTAGRAM_ACCOUNT_ID }}
      INSTAGRAM_IMAGE_URL: ${{ inputs.instagram_image_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-generativeai requests python-dotenv loguru Pillow
      - name: Prepare post
        if: inputs.prepared_run_id == ''
        env:
          TOPIC: ${{ inputs.topic }}
          VARIANT: ${{ inputs.variant }}
        run: python -m scripts.orchestrator --workflow social --topic "$TOPIC" --variant "$VARIANT"
      - uses: actions/download-artifact@v4
        if: inputs.prepared_run_id != ''
        with:
          name: social-output
          path: runs/current
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
      - name: Publish reviewed post
        if: inputs.prepared_run_id != ''
        env:
          PLATFORMS: ${{ inputs.platforms }}
        shell: bash
        run: |
          args=("$PLATFORMS")
          if [[ "$PLATFORMS" == "both" ]]; then args=(facebook instagram); fi
          python -m scripts.orchestrator --workflow social --post-file runs/current/post.json --upload --platforms "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: social-output
          path: runs/current/
          retention-days: 7
